name: Weekly Technology & Trends briefing

on:
  schedule:
    # 06:00 UTC every Monday = 08:00 Rome in summer, 07:00 in winter.
    - cron: "0 6 * * 1"
  workflow_dispatch:        # lets us run it on demand to test

permissions:
  contents: write

concurrency:
  group: weekly-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate this week's briefing
        run: python build_briefing.py

      - name: Commit if the content changed
        run: |
          if git diff --quiet -- content.json; then
            echo "No change to content.json - nothing to commit."
            exit 0
          fi
          git config user.name  "DropaCode Insights Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git commit -m "Weekly briefing $(date -u +%Y-%m-%d)"
          git push
